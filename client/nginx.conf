server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

     # React Router uses client-side routing - if someone directly visits
    # or refreshes a URL like /employees/123/edit, there's no actual file
    # at that path on disk. This tells Nginx: if the requested file/path
    # doesn't exist, serve index.html instead, and let React Router's
    # own JavaScript figure out what to render based on the URL.
    location / {
        try_files $uri $uri/ /index.html;
    }

 # Forwards any request starting with /api to the backend container.
    # "server" here is the service name we'll define in docker-compose.yml -
    # Docker's internal networking resolves that name to the right
    # container automatically, no IP addresses needed.
    location /api {
        proxy_pass http://server:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }    

     # Same idea, for uploaded files (resumes, profile pictures).
     location /uploads {
        proxy_pass http://server:5000;
        proxy_set_header Host $host;
     }
}